# GitGuardian scan config. Tests use obviously fake credentials (Passw0rd!); app code, config
# and docs are still scanned.
# Never put a real secret in a test either: use `ggignore` on a single line only for a dummy value.
version: 2
secret:
  ignored_paths:
    - "src/**/*.test.ts"
    - "src/**/*.test.tsx"
    - "src/test/**"
