name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  VITE_APP_NAME: PiVault
  VITE_API_BASE_URL: https://pivault.shivamingale.com

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/live'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            VITE_APP_NAME=${{ env.VITE_APP_NAME }}
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: ghcr.io/shivamingale3/pivault-pwa:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-failure:
    needs: [check, image]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text=$(printf '❌ %s CI failed on %s (%s)\n%s' \
            "${GITHUB_REPOSITORY#*/}" "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$text" > /dev/null
